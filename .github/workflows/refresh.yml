name: Refresh job board

on:
  schedule:
    - cron: '0 6 * * *'      # every day at 06:00 UTC
  workflow_dispatch:          # lets you run it by hand from the Actions tab

permissions:
  contents: write             # needed so the bot can commit data/jobs.json

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Pull latest dataset from Apify
        env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
          APIFY_TASK_ID: ${{ vars.APIFY_TASK_ID }}   # e.g. yourname~my-job-task
        run: |
          mkdir -p data
          URL="https://api.apify.com/v2/actor-tasks/${APIFY_TASK_ID}/runs/last/dataset/items"
          curl -fsSL "${URL}?token=${APIFY_TOKEN}&status=SUCCEEDED&format=json&clean=true" -o data/jobs.json
          echo "Pulled $(grep -o '\"id\"' data/jobs.json | wc -l) records"

      - name: Commit if changed
        run: |
          git config user.name  "job-board-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/jobs.json
          if git diff --staged --quiet; then
            echo "No changes today."
          else
            git commit -m "Daily refresh: $(date -u +%Y-%m-%d)"
            git push
          fi
